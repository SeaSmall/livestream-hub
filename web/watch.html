<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>直播中</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="stage">

  <div class="player-col">
    <div class="video-frame" id="videoFrame">
      <video id="v" playsinline webkit-playsinline autoplay muted></video>
      <div class="overlay" id="overlay">
        <div class="spinner" id="spin"></div>
        <div id="ovText">正在连接…</div>
        <button class="ghost" id="retryBtn" style="display:none">重试</button>
      </div>

      <!-- 全屏时才出现的弹幕层 -->
      <div class="fs-layer" id="fsLayer"></div>

      <!-- 全屏时的底部输入条（仿 B 站） -->
      <div class="fs-bar" id="fsBar">
        <input type="text" id="fsInput" placeholder="发条弹幕…" maxlength="300"
               autocomplete="off" enterkeyhint="send">
        <button class="fs-send" id="fsSendBtn">发送</button>
      </div>

      <!-- 全屏退出/弹幕开关 -->
      <div class="fs-top" id="fsTop">
        <span class="fs-hint">点屏幕显示输入框</span>
        <span class="spacer"></span>
        <button class="fs-mini" id="dmToggle" title="显示/隐藏弹幕">弹幕 开</button>
        <button class="fs-mini" id="fsExit" title="退出全屏">退出全屏</button>
      </div>
    </div>
    <div class="statusbar">
      <span class="dot" id="dot"></span>
      <span id="stText">连接中</span>
      <span id="soundBtn" style="display:none;cursor:pointer;color:var(--accent2);font-weight:600">🔇 点击开启声音</span>
      <span class="spacer"></span>
      <span id="stRoute" class="badge detecting">—</span>
      <span id="stLag">—</span>
      <span id="stOnline">—</span>
      <button class="fs-btn" id="fsBtn" title="全屏">⛶ 全屏</button>
    </div>
  </div>

  <div class="chat-col">
    <div class="chat-head">
      <strong>聊天</strong>
      <span class="spacer"></span>
      <span class="tip" id="onlineTip">连接中…</span>
    </div>
    <div class="online-bar" id="onlineBar" style="display:none"></div>
    <div class="chat-list" id="chatList"></div>
    <div class="chat-foot">
      <input type="text" id="msgInput" placeholder="说点什么…（回车发送）" maxlength="300" autocomplete="off">
      <button class="primary" id="sendBtn">发送</button>
    </div>
  </div>

</div>

<script src="/hls.min.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const video = $('v');
const LS_TOKEN = 'ls_token_v1';
const LS_ROUTE = 'ls_route_v1';

const token = localStorage.getItem(LS_TOKEN);
const myName = localStorage.getItem('ls_name_v1') || '';
if (!token) location.href = '/';

const route = JSON.parse(localStorage.getItem(LS_ROUTE) || 'null') || { kind: 'wan', url: location.origin };
const onLan = location.origin === route.url;

const PATHS = { lan: 'live', wan: 'wan' };
let hls = null, pc = null, ws = null, currentMode = '', chatStopped = false, kickedByMod = false;

// 媒体请求（HLS 分片、WHEP）是播放器自己发的，带不了自定义请求头，
// 凭证只能走 cookie 或查询串 —— 两个都用上，哪个通都行。
const MEDIA_QS = '?token=' + encodeURIComponent(token);

// 进页面先跟服务端对一次会话，顺便让它在**当前域名**下种一次媒体 cookie。
// （切换线路时隧道域名和直连域名不是一个域，cookie 不会自己跟过去）
async function syncCookie() {
  try {
    const r = await fetch('/api/me?token=' + encodeURIComponent(token), { cache: 'no-store' });
    if (r.status === 401 || r.status === 403) {
      let why = '';
      try { why = (await r.json()).error || ''; } catch (_) {}
      localStorage.removeItem(LS_TOKEN);
      if (/移出/.test(why)) { localStorage.setItem('ls_kicked_hint', why); }
      location.replace('/');
      return false;
    }
    if (document.cookie.indexOf('ls_t=') < 0) {
      // cookie 被浏览器拦了。查询串还能兜住 HLS（MediaMTX 会把查询串带进分片地址）
      reportFail('cookie-missing', '媒体 cookie 没种上，改用 URL 凭据');
    }
    return true;
  } catch (_) {
    return true;   // 网络抖一下就当没事，后面的播放链路自己会重试
  }
}

/* ---------------- 状态显示 ---------------- */
function setStatus(state, text) {
  $('dot').className = 'dot ' + (state === 'ok' ? 'ok' : state === 'err' ? 'err' : '');
  $('stText').textContent = text;
}
function setOverlay(show, text, retry) {
  $('overlay').className = show ? 'overlay' : 'overlay hide';
  if (text) $('ovText').textContent = text;
  $('spin').style.display = retry ? 'none' : '';
  $('retryBtn').style.display = retry ? '' : 'none';
}
function setRouteBadge() {
  const b = $('stRoute');
  if (currentMode === 'webrtc' && onLan) { b.className = 'badge lan'; b.textContent = '校园网直连 · WebRTC'; }
  else if (currentMode === 'hls-lan') { b.className = 'badge lan'; b.textContent = '校园网直连 · HLS'; }
  else { b.className = 'badge wan'; b.textContent = '隧道 · HLS 720P'; }
}

/* ---------------- WebRTC (WHEP) ---------------- */
function iceDone(p, ms) {
  return new Promise((res) => {
    if (p.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, ms);
    p.addEventListener('icegatheringstatechange', () => {
      if (p.iceGatheringState === 'complete') { clearTimeout(t); res(); }
    });
  });
}
function waitState(p, ms) {
  return new Promise((res, rej) => {
    if (p.connectionState === 'connected') return res();
    const t = setTimeout(() => rej(new Error('ICE 超时')), ms);
    p.addEventListener('connectionstatechange', () => {
      if (p.connectionState === 'connected') { clearTimeout(t); res(); }
      else if (p.connectionState === 'failed') { clearTimeout(t); rej(new Error('ICE 失败')); }
    });
  });
}
async function startWebRTC(path) {
  const p = new RTCPeerConnection({ iceServers: [] });
  const stream = new MediaStream();
  p.addTransceiver('video', { direction: 'recvonly' });
  p.addTransceiver('audio', { direction: 'recvonly' });
  p.ontrack = (ev) => {
    ev.streams[0].getTracks().forEach(t => { if (!stream.getTracks().includes(t)) stream.addTrack(t); });
    video.srcObject = stream;
  };
  await p.setLocalDescription(await p.createOffer());
  await iceDone(p, 1000);
  // 必须带超时：隧道慢的时候这个请求可能一直挂着，
  // 会让整条降级链卡死在"正在建立低延迟连接…"。
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 8000);
  let r;
  try {
    r = await fetch(`/whep/${path}/whep` + MEDIA_QS, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: p.localDescription.sdp,
      signal: ctrl.signal
    });
  } catch (e) {
    p.close();
    throw new Error('WHEP 请求失败/超时: ' + (e && e.name === 'AbortError' ? '8 秒无响应' : (e && e.message)));
  } finally { clearTimeout(to); }
  if (!r.ok) { p.close(); throw new Error('WHEP HTTP ' + r.status); }
  await p.setRemoteDescription({ type: 'answer', sdp: await r.text() });
  await waitState(p, 3500);
  return p;
}

/* ---------------- HLS ---------------- */
function startHLS(path) {
  return new Promise((resolve, reject) => {
    const url = `/hls/${path}/index.m3u8` + MEDIA_QS;
    if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
    // 防御性清理：万一之前试过 WebRTC，srcObject 必须先清掉，否则 MSE 挂不上去
    try { video.srcObject = null; } catch (_) {}
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({
        lowLatencyMode: true,
        backBufferLength: 15,
        maxBufferLength: 6,
        liveSyncDurationCount: 2,
        manifestLoadingTimeOut: 12000,
        manifestLoadingMaxRetry: 4,
        fragLoadingMaxRetry: 6
      });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { try { hls.startLoad(); return; } catch (_) {} }
          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { try { hls.recoverMediaError(); return; } catch (_) {} }
          reject(new Error('HLS 致命错误: ' + data.details));
        }
      });
      hls.on(Hls.Events.MANIFEST_PARSED, () => resolve());
      hls.loadSource(url);
      hls.attachMedia(video);
      setTimeout(() => reject(new Error('HLS 加载超时')), 15000);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.addEventListener('loadedmetadata', () => resolve(), { once: true });
      setTimeout(() => reject(new Error('HLS 加载超时')), 15000);
    } else {
      reject(new Error('浏览器不支持 HLS'));
    }
  });
}

/* ---------------- 失败上报（手机上出问题时，主机能直接看到原因）---------------- */
function reportFail(stage, detail) {
  try {
    fetch('/api/selftest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      keepalive: true,
      body: JSON.stringify({
        stage: 'playback-fail',
        at: stage,
        detail: String(detail || '').slice(0, 200),
        route: onLan ? 'lan' : 'wan',
        mode: currentMode || '(尚未连上)',
        ua: navigator.userAgent.slice(0, 110),
        screen: screen.width + 'x' + screen.height,
        online: navigator.onLine
      })
    }).catch(() => {});
  } catch (_) {}
}
window.addEventListener('error', (e) => reportFail('js-error', (e.message || '') + ' @line' + (e.lineno || '')));
window.addEventListener('unhandledrejection', (e) => reportFail('promise', (e.reason && e.reason.message) || e.reason));

// 连上后上报一次，并回报实际播放状态（用来确认画面真的在走，不只是"连上了"）
let okReported = false;
function reportOk(mode, path) {
  if (okReported) return;
  okReported = true;
  setTimeout(() => {
    try {
      const b = video.buffered;
      fetch('/api/selftest', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
        body: JSON.stringify({
          stage: 'playback-ok', mode, path,
          route: onLan ? 'lan' : 'wan',
          playing: !video.paused && video.currentTime > 0.5,
          currentTime: +video.currentTime.toFixed(2),
          readyState: video.readyState,
          buffered: b.length ? +b.end(b.length - 1).toFixed(2) : 0,
          latency: (hls && typeof hls.latency === 'number') ? +hls.latency.toFixed(2) : null,
          ua: navigator.userAgent.slice(0, 110)
        })
      }).catch(() => {});
    } catch (_) {}
  }, 8000);
}

/* ---------------- 连接编排 ---------------- */
// 被移出观看之后，画面必须真的停掉：关掉 WebRTC、销毁 hls.js、清空 <video>，
// 并且不让降级链继续往下试、不让重试按钮把人放回来。
let blocked = false;
function stopPlayback(reason, canReenter) {
  blocked = true;
  try { if (hls) { hls.destroy(); hls = null; } } catch (_) {}
  try { if (pc) { pc.close(); pc = null; } } catch (_) {}
  try { video.pause(); } catch (_) {}
  try { video.srcObject = null; } catch (_) {}
  try { video.removeAttribute('src'); video.load(); } catch (_) {}
  currentMode = '';
  $('soundBtn').style.display = 'none';
  $('stRoute').className = 'badge';
  $('stRoute').textContent = '已断开';
  $('stLag').textContent = '—';
  setStatus('err', canReenter ? '已被移出' : '已禁足本场');
  setOverlay(true, reason, false);
  $('spin').style.display = 'none';     // 终态：不要转圈，让人以为还在连
  const b = $('retryBtn');
  b.style.display = 'none';
  if (canReenter) {
    // 只是被请出去一次，重新从入口页进来就能继续看
    b.textContent = '重新进入';
    b.style.display = '';
    b.onclick = () => location.replace('/');
  }
}
function lockChat(placeholder) {
  ['msgInput', 'fsInput'].forEach((id) => {
    const el = $(id);
    if (el) { el.disabled = true; el.placeholder = placeholder || '已断开'; }
  });
  ['sendBtn', 'fsSendBtn'].forEach((id) => {
    const b = $(id);
    if (b) b.disabled = true;
  });
}

async function connect() {
  if (blocked) return;
  setOverlay(true, '正在连接…');
  $('retryBtn').style.display = 'none';

  // 局域网优先 WebRTC(带声音、亚秒延迟); 若 OBS 走 WHIP 推流,
  // live 的音轨是 Opus, 其 HLS 兼容性不保证, 所以兜底直接落到 wan(720p/AAC)
  const plan = onLan
    ? [['webrtc', PATHS.lan], ['hls-wan', PATHS.wan]]
    : [['hls-wan', PATHS.wan], ['hls-lan', PATHS.lan]];

  const tried = [];
  for (const [mode, path] of plan) {
    if (blocked) return;
    try {
      setOverlay(true, mode === 'webrtc' ? '正在建立低延迟连接…' : '正在加载直播流…');
      if (mode === 'webrtc') { pc = await startWebRTC(path); }
      else { await startHLS(path); }
      currentMode = mode;
      setRouteBadge();
      setStatus('ok', '已连接');
      setOverlay(false);
      $('soundBtn').style.display = '';
      try { await video.play(); } catch (_) {}
      reportOk(mode, path);
      return;
    } catch (e) {
      tried.push(mode + ': ' + e.message);
      console.warn('线路失败', mode, e.message);
      reportFail(mode, e.message);
      if (pc) { try { pc.close(); } catch (_) {} pc = null; }
      if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
      // 关键！WebRTC 试过之后 video.srcObject 上挂着一个已经死掉的 MediaStream。
      // 浏览器里 srcObject 和 src(MSE) 互斥，不清掉的话后面 hls.js 根本挂不上去，
      // 表现就是画面永远停在"缓冲中"。
      try { video.srcObject = null; } catch (_) {}
    }
  }
  setStatus('err', '连接失败');
  if (blocked) return;
  setOverlay(true, '无法连接到直播流。\n' + tried.join('\n') + '\n\n请确认 OBS 正在推流，或稍后重试。', true);
}

/* ---------------- 聊天 ---------------- */
function addMsg(m, mine) {
  const d = document.createElement('div');
  d.className = 'chat-item fly' + (mine ? ' mine' : '');
  const t = new Date(m.ts || Date.now());
  const hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
  d.innerHTML = `<span class="who">${esc(m.name)}</span><span style="color:var(--muted);font-size:11.5px">${hh}</span><br>${esc(m.text)}`;
  $('chatList').appendChild(d);
  $('chatList').scrollTop = $('chatList').scrollHeight;
  while ($('chatList').children.length > 300) $('chatList').removeChild($('chatList').firstChild);
  emitDanmaku(m);   // 全屏时同时飘一条弹幕
}
function addSys(text) {
  const d = document.createElement('div');
  d.className = 'chat-item sys';
  d.textContent = text;
  $('chatList').appendChild(d);
  $('chatList').scrollTop = $('chatList').scrollHeight;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* 被禁言：输入框锁上，按钮变灰，并给出明确原因（不要含糊的"发送失败"） */
let iAmMuted = false;
function setMuted(on) {
  iAmMuted = !!on;
  const inputs = [['msgInput', '说点什么…（回车发送）'], ['fsInput', '发条弹幕…']];
  inputs.forEach(([id, ph]) => {
    const el = $(id);
    if (!el) return;
    el.disabled = iAmMuted;
    el.placeholder = iAmMuted ? '你被禁言了' : ph;
  });
  ['sendBtn', 'fsSendBtn'].forEach((id) => {
    const b = $(id);
    if (b) b.disabled = iAmMuted;
  });
  addSys(iAmMuted ? '🔇 你已被主人禁言，暂时不能发言' : '🔊 禁言已解除，可以正常发言了');
}

function connectChat() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/chat?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { $('onlineTip').textContent = '已连接'; };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.t === 'hello') {
      (m.history || []).forEach(x => addMsg(x, x.name === myName));
      addSys('—— 已进入聊天 ——');
    } else if (m.t === 'msg') {
      addMsg(m, m.name === myName);
    } else if (m.t === 'presence') {
      $('onlineTip').textContent = m.online + ' 人在线';
      $('stOnline').textContent = m.online + ' 人在线';
      const bar = $('onlineBar');
      if (bar) {
        const list = (m.detail && m.detail.length) ? m.detail : (m.users || []).map(n => ({ name: n, via: 'wan' }));
        bar.innerHTML = list.map(u =>
          `<span class="peer ${u.via === 'lan' ? 'lan' : 'wan'}${u.muted ? ' muted' : ''}" title="${u.via === 'lan' ? '校园网直连' : '隧道'}${u.muted ? ' · 已禁言' : ''}">${esc(u.name)}${u.muted ? ' 🔇' : ''}</span>`
        ).join('');
        bar.style.display = list.length ? '' : 'none';
      }
    } else if (m.t === 'kicked') {
      chatStopped = true;
      kickedByMod = true;
      addSys('⚠ ' + (m.reason || '连接被服务端断开'));
      $('onlineTip').textContent = '已被断开';
      // 关键：把画面也断掉。只断 WebSocket 的话，正在播的 HLS/WebRTC 还会继续。
      stopPlayback(
        m.banned
          ? '你已被连续移出 ' + (m.count || 3) + ' 次\n\n本场直播你不能再进入了。'
          : '你已被移出观看（第 ' + (m.count || 1) + ' 次）\n\n画面已断开。\n再被移出几次就进不来了，点下面的按钮重新进入。',
        !m.banned
      );
      lockChat('你已被移出观看');
    } else if (m.t === 'sys') {
      addSys(m.text);
    } else if (m.t === 'muted') {
      setMuted(!!m.muted);
    } else if (m.t === 'warn') {
      addSys(m.text);
    } else if (m.t === 'cleared') {
      // 开播/手动清空：本地也一起清掉，保证"每开播聊天都是新的"
      $('chatList').innerHTML = '';
      $('fsLayer').innerHTML = '';
      addSys('—— 新一轮直播开始，聊天已重置 ——');
    } else if (m.t === 'stats') {
      /* 观众端不展示流量 */
    }
  };
  ws.onclose = () => {
    // 被主人踢掉时 onclose 会紧跟着 kicked 消息到，别把更有信息量的提示覆盖掉
    if (chatStopped) { $('onlineTip').textContent = kickedByMod ? '已被断开' : '已断开'; return; }
    $('onlineTip').textContent = '连接断开，重连中…';
    setTimeout(connectChat, 3000);
  };
  ws.onerror = () => {};
}
function send(fromEl) {
  // 注意：send 会被直接当成 click 回调注册（此时第一个参数是 MouseEvent），
  // 所以这里必须判断它到底是不是一个输入框，不能简单用 `fromEl || ...`
  const el = (fromEl && typeof fromEl.value === 'string') ? fromEl : $('msgInput');
  if (!el) return;
  const text = el.value.trim();
  if (!text) return;
  if (iAmMuted) { addSys('你被禁言了，暂时不能发言'); return; }
  if (!ws || ws.readyState !== 1) { addSys('聊天还没连上，稍等一下再发'); return; }
  ws.send(JSON.stringify({ t: 'msg', text }));
  el.value = '';
  try { el.focus(); } catch (_) {}
}

/* ---------------- 全屏 & 弹幕 ---------------- */
const stage = document.querySelector('.stage');
const frame = $('videoFrame');
let fsActive = false, dmOn = true, fsHideTimer = null;

function fsElement() {
  return document.fullscreenElement || document.webkitFullscreenElement ||
         document.mozFullScreenElement || document.msFullscreenElement || null;
}
function requestFs(el) {
  const fn = el.requestFullscreen || el.webkitRequestFullscreen ||
             el.mozRequestFullScreen || el.msRequestFullscreen;
  if (!fn) return Promise.reject(new Error('fullscreen unsupported'));
  try { const r = fn.call(el); return (r && r.then) ? r : Promise.resolve(); }
  catch (e) { return Promise.reject(e); }
}
function exitFs() {
  const fn = document.exitFullscreen || document.webkitExitFullscreen ||
             document.mozCancelFullScreen || document.msExitFullscreen;
  if (!fn) return Promise.reject(new Error('fullscreen unsupported'));
  try { const r = fn.call(document); return (r && r.then) ? r : Promise.resolve(); }
  catch (e) { return Promise.reject(e); }
}

async function toggleFullscreen() {
  if (fsElement()) { try { await exitFs(); } catch (_) {} return; }
  try {
    await requestFs(stage);
  } catch (_) {
    // iOS Safari 不支持给普通元素全屏，只能退到视频原生全屏
    if (video.webkitEnterFullscreen) {
      try { video.webkitEnterFullscreen(); return; } catch (_) {}
    }
    addSys('这个浏览器不支持网页全屏。iPhone 上可以先「添加到主屏幕」再打开，或把手机横过来看。');
  }
}

function onFullscreenChange() {
  const on = !!fsElement();
  fsActive = on;
  stage.classList.toggle('is-fs', on);
  $('fsBtn').textContent = on ? '⛶ 退出全屏' : '⛶ 全屏';
  if (on) { showFsUi(); }
  else { $('fsLayer').innerHTML = ''; $('fsBar').style.bottom = ''; stage.classList.remove('fs-ui'); }
  setTimeout(() => window.scrollTo(0, 0), 80);
}
['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
  .forEach(ev => document.addEventListener(ev, onFullscreenChange));

function showFsUi() {
  if (!fsActive) return;
  stage.classList.add('fs-ui');
  clearTimeout(fsHideTimer);
  // 输入框聚焦时不要自动隐藏，否则键盘一弹就没了
  if (document.activeElement && document.activeElement.id === 'fsInput') return;
  fsHideTimer = setTimeout(() => stage.classList.remove('fs-ui'), 4000);
}
function toggleFsUi() {
  if (stage.classList.contains('fs-ui')) stage.classList.remove('fs-ui');
  else showFsUi();
}

frame.addEventListener('click', (e) => {
  if (!fsActive) return;
  if (e.target.closest('.fs-bar') || e.target.closest('.fs-top')) return;
  toggleFsUi();
});
frame.addEventListener('mousemove', showFsUi);
frame.addEventListener('touchstart', () => { if (fsActive) showFsUi(); }, { passive: true });

// 手机弹键盘时把输入条顶上去（只靠 CSS 做不到）
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fixBar = () => {
    if (!fsActive) { $('fsBar').style.bottom = ''; return; }
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    $('fsBar').style.bottom = kb + 'px';
  };
  vv.addEventListener('resize', fixBar);
  vv.addEventListener('scroll', fixBar);
}

/* 弹幕：全屏时把消息飘过去 */
let dmLane = 0;
function emitDanmaku(m) {
  if (!fsActive || !dmOn) return;
  const layer = $('fsLayer');
  if (!layer) return;
  const el = document.createElement('div');
  el.className = 'dm';
  el.textContent = (m.name ? m.name + '：' : '') + m.text;
  el.style.top = (6 + (dmLane++ % 5) * 9.5) + '%';
  // 依文字长度调整飞行时长，保证速度观感一致
  el.style.animationDuration = Math.min(16, Math.max(7, el.textContent.length * 0.32)) + 's';
  layer.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
  setTimeout(() => el.remove(), 20000);
  while (layer.children.length > 40) layer.removeChild(layer.firstChild);
}

$('fsBtn').addEventListener('click', toggleFullscreen);
$('fsExit').addEventListener('click', (e) => { e.stopPropagation(); exitFs().catch(() => {}); });
$('dmToggle').addEventListener('click', (e) => {
  e.stopPropagation();
  dmOn = !dmOn;
  $('dmToggle').textContent = '弹幕 ' + (dmOn ? '开' : '关');
  if (!dmOn) $('fsLayer').innerHTML = '';
  showFsUi();
});
$('fsSendBtn').addEventListener('click', (e) => { e.stopPropagation(); send($('fsInput')); showFsUi(); });
$('fsInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); send($('fsInput')); showFsUi(); }
});
$('fsInput').addEventListener('focus', showFsUi);
$('fsInput').addEventListener('blur', showFsUi);
window.addEventListener('orientationchange', () => setTimeout(() => { showFsUi(); window.scrollTo(0, 0); }, 250));

/* ---------------- 延迟上报(给主机端做同步补偿) ---------------- */
setInterval(() => {
  if (!ws || ws.readyState !== 1) return;
  let ms = 0;
  if (hls && typeof hls.latency === 'number') ms = hls.latency * 1000;
  else if (pc) {
    const r = pc.connectionState === 'connected' ? 250 : 0;
    ms = r;
  }
  if (ms > 0) {
    ws.send(JSON.stringify({ t: 'lag', ms: Math.round(ms) }));
    $('stLag').textContent = '延迟 ' + (ms / 1000).toFixed(1) + 's';
  }
}, 5000);

/* ---------------- 事件 ---------------- */
$('sendBtn').addEventListener('click', () => send());
$('msgInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
$('retryBtn').addEventListener('click', () => {
  if (blocked) return;
  if (pc) { try { pc.close(); } catch (_) {} pc = null; }
  connect();
});
$('soundBtn').addEventListener('click', () => {
  video.muted = false;
  video.volume = 1;
  $('soundBtn').style.display = 'none';
});

video.addEventListener('playing', () => setStatus('ok', '播放中'));
video.addEventListener('waiting', () => setStatus('', '缓冲中…'));

(async () => {
  // 先确认会话、种好媒体 cookie，再开始拉流 —— 否则第一次媒体请求可能没凭据
  const ok = await syncCookie();
  if (ok === false) return;     // 会话无效/已被移出，正在跳回入口页
  connect();
  connectChat();
})();
</script>
</body>
