<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观众消息</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="hostwin">
<div class="hw">

  <div class="hw-head">
    <span class="dot" id="dot" style="width:8px;height:8px;border-radius:50%;background:#8b93a7;display:inline-block"></span>
    <span id="status">连接中…</span>
    <span class="spacer" style="flex:1"></span>
    <span id="online">0 人在线</span>
    <span id="clock"></span>
  </div>

  <div class="hw-list" id="list"></div>

  <div class="hw-foot">
    <span>隧道流量</span>
    <span class="bar" id="bar"><i id="barFill"></i></span>
    <span id="quota">— / 16 GB</span>
  </div>

</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const HOST_KEY = new URLSearchParams(location.search).get('key') || localStorage.getItem('ls_host_key') || '';
localStorage.setItem('ls_host_key', HOST_KEY);

/* 主机端不参与门禁与发言，用一个内置只读身份连接 */
let ws = null, pending = [], quotaBytes = 16 * 1024 * 1024 * 1024;

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function render(m) {
  const d = document.createElement('div');
  d.className = 'hw-item ' + (m.via === 'lan' ? 'lan' : 'wan');
  const t = new Date(m.ts || Date.now());
  const hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0')
           + ':' + String(t.getSeconds()).padStart(2, '0');
  d.innerHTML = `<span class="t">${hh}</span><span class="who">${esc(m.name)}</span>${esc(m.text)}`;
  $('list').appendChild(d);
  $('list').scrollTop = $('list').scrollHeight;
  while ($('list').children.length > 400) $('list').removeChild($('list').firstChild);
}

/* 延迟补偿: 观众看到画面的时间比实时晚 lagMs, 把消息也推迟同样时间渲染,
   这样"你讲的那一屏"和"你看到的评论"才是对齐的 */
function enqueue(m) {
  const lag = Math.max(0, Math.min(20000, Number(m.lagMs) || 0));
  if (lag <= 300) { render(m); return; }
  pending.push({ at: Date.now() + lag, m });
}
setInterval(() => {
  const now = Date.now();
  pending = pending.filter(p => { if (p.at <= now) { render(p.m); return false; } return true; });
}, 200);

function fmtBytes(b) {
  if (b >= 1024 ** 3) return (b / 1024 ** 3).toFixed(2) + ' GB';
  if (b >= 1024 ** 2) return (b / 1024 ** 2).toFixed(1) + ' MB';
  return (b / 1024).toFixed(0) + ' KB';
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  if (!HOST_KEY) {
    $('status').textContent = '缺少密钥：请用 host?key=... 打开';
    $('dot').style.background = '#ff5d5d';
    return;
  }
  ws = new WebSocket(`${proto}://${location.host}/chat?token=${encodeURIComponent(HOST_KEY)}&host=1`);
  ws.onopen = () => { $('status').textContent = '已连接'; $('dot').style.background = '#3ecf8e'; };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.t === 'hello') {
      (m.history || []).forEach(x => render(x));
    } else if (m.t === 'msg') {
      enqueue(m);
    } else if (m.t === 'presence') {
      $('online').textContent = m.online + ' 人在线';
    } else if (m.t === 'stats') {
      quotaBytes = m.quotaBytes || quotaBytes;
      const pct = Math.min(1, m.percent || 0);
      $('barFill').style.width = (pct * 100).toFixed(1) + '%';
      const bar = $('bar');
      bar.className = 'bar' + (pct > 0.9 ? ' err' : pct > 0.7 ? ' warn' : '');
      $('quota').textContent = fmtBytes(m.wanBytes) + ' / ' + (quotaBytes / 1024 ** 3).toFixed(0) + ' GB';
    }
  };
  ws.onclose = () => {
    $('status').textContent = '连接断开，重连中…';
    $('dot').style.background = '#ff5d5d';
    setTimeout(connect, 3000);
  };
}

setInterval(() => {
  const d = new Date();
  $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}, 1000);

connect();
</script>
</body>
</html>
