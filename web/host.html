<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观众消息</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="hostwin">
<div class="hw">

  <div class="hw-head">
    <span class="dot" id="dot" style="width:8px;height:8px;border-radius:50%;background:#8b93a7;display:inline-block"></span>
    <span id="status">连接中…</span>
    <span class="spacer" style="flex:1"></span>
    <span id="online">0 人在线</span>
    <span id="clock"></span>
  </div>

  <div class="hw-online" id="hwOnline"><span class="tip">等待观众…</span></div>

  <div class="hw-list" id="list"></div>

  <div class="hw-foot">
    <span>隧道流量</span>
    <span class="bar" id="bar"><i id="barFill"></i></span>
    <span id="quota">— / 16 GB</span>
  </div>

</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const HOST_KEY = new URLSearchParams(location.search).get('key') || localStorage.getItem('ls_host_key') || '';
localStorage.setItem('ls_host_key', HOST_KEY);

/* 主机端不参与门禁与发言，用一个内置只读身份连接 */
let ws = null, pending = [], quotaBytes = 16 * 1024 * 1024 * 1024;

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function render(m) {
  const d = document.createElement('div');
  d.className = 'hw-item ' + (m.via === 'lan' ? 'lan' : 'wan');
  const t = new Date(m.ts || Date.now());
  const hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0')
           + ':' + String(t.getSeconds()).padStart(2, '0');
  d.innerHTML = `<span class="t">${hh}</span><span class="who">${esc(m.name)}</span>${esc(m.text)}`;
  $('list').appendChild(d);
  $('list').scrollTop = $('list').scrollHeight;
  while ($('list').children.length > 400) $('list').removeChild($('list').firstChild);
}

function sysLine(text) {
  const d = document.createElement('div');
  d.className = 'hw-sys';
  d.textContent = text;
  $('list').appendChild(d);
  $('list').scrollTop = $('list').scrollHeight;
}

/* ---------------- 点观众名字 -> 踢出 / 禁言 ---------------- */
let menuEl = null, currentUsers = [];
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
document.addEventListener('click', (e) => {
  if (menuEl && !menuEl.contains(e.target)) closeMenu();
});

function sendMod(action, name) {
  if (!ws || ws.readyState !== 1) { sysLine('未连接，操作没发出去'); return; }
  ws.send(JSON.stringify({ t: 'mod', action, name }));
}

function openMenu(chip, u) {
  closeMenu();
  const r = chip.getBoundingClientRect();
  const m = document.createElement('div');
  m.className = 'mod-menu';
  const mk = (label, cls, fn) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mod-btn' + (cls ? ' ' + cls : '');
    b.textContent = label;
    b.onclick = (ev) => { ev.stopPropagation(); closeMenu(); fn(); };
    m.appendChild(b);
  };
  mk(u.muted ? '解除禁言' : '禁言', '', () => sendMod(u.muted ? 'unmute' : 'mute', u.name));
  mk('踢出', 'danger', () => {
    if (confirm('把「' + u.name + '」移出观看？\n（对方会立刻断开，需要名字才能重新进来）')) sendMod('kick', u.name);
  });
  m.style.left = Math.max(4, Math.min(r.left, window.innerWidth - 140)) + 'px';
  m.style.top = Math.min(r.bottom + 4, window.innerHeight - 90) + 'px';
  document.body.appendChild(m);
  menuEl = m;
}

/* 延迟补偿: 观众看到画面的时间比实时晚 lagMs, 把消息也推迟同样时间渲染,
   这样"你讲的那一屏"和"你看到的评论"才是对齐的 */
function enqueue(m) {
  const lag = Math.max(0, Math.min(20000, Number(m.lagMs) || 0));
  if (lag <= 300) { render(m); return; }
  pending.push({ at: Date.now() + lag, m });
}
setInterval(() => {
  const now = Date.now();
  pending = pending.filter(p => { if (p.at <= now) { render(p.m); return false; } return true; });
}, 200);

function fmtBytes(b) {
  if (b >= 1024 ** 3) return (b / 1024 ** 3).toFixed(2) + ' GB';
  if (b >= 1024 ** 2) return (b / 1024 ** 2).toFixed(1) + ' MB';
  return (b / 1024).toFixed(0) + ' KB';
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  if (!HOST_KEY) {
    $('status').textContent = '缺少密钥：请用 host?key=... 打开';
    $('dot').style.background = '#ff5d5d';
    return;
  }
  ws = new WebSocket(`${proto}://${location.host}/chat?token=${encodeURIComponent(HOST_KEY)}&host=1`);
  ws.onopen = () => { $('status').textContent = '已连接'; $('dot').style.background = '#3ecf8e'; };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.t === 'hello') {
      (m.history || []).forEach(x => render(x));
    } else if (m.t === 'msg') {
      enqueue(m);
    } else if (m.t === 'presence') {
      $('online').textContent = m.online + ' 人在线';
      const bar = $('hwOnline');
      if (bar) {
        const list = (m.detail && m.detail.length) ? m.detail : (m.users || []).map(n => ({ name: n, via: 'wan' }));
        currentUsers = list;
        closeMenu();
        bar.innerHTML = list.length
          ? list.map(u => `<span class="peer ${u.via === 'lan' ? 'lan' : 'wan'}${u.muted ? ' muted' : ''}" data-name="${esc(u.name)}" title="${u.via === 'lan' ? '校园网直连' : '隧道'}${u.muted ? ' · 已禁言' : ''} · 点击可踢人或禁言">${esc(u.name)}${u.muted ? ' 🔇' : ''}</span>`).join('')
          : '<span class="tip">暂时没有观众</span>';
        Array.prototype.forEach.call(bar.querySelectorAll('.peer'), (chip) => {
          chip.onclick = (ev) => {
            ev.stopPropagation();
            const nm = chip.getAttribute('data-name');
            const u = currentUsers.filter(x => x.name === nm)[0];
            if (u) openMenu(chip, u); else closeMenu();
          };
        });
      }
    } else if (m.t === 'sys') {
      sysLine(m.text);
    } else if (m.t === 'cleared') {
      $('list').innerHTML = '';
    } else if (m.t === 'stats') {
      quotaBytes = m.quotaBytes || quotaBytes;
      const pct = Math.min(1, m.percent || 0);
      $('barFill').style.width = (pct * 100).toFixed(1) + '%';
      const bar = $('bar');
      bar.className = 'bar' + (pct > 0.9 ? ' err' : pct > 0.7 ? ' warn' : '');
      $('quota').textContent = fmtBytes(m.wanBytes) + ' / ' + (quotaBytes / 1024 ** 3).toFixed(0) + ' GB';
    }
  };
  ws.onclose = () => {
    $('status').textContent = '连接断开，重连中…';
    $('dot').style.background = '#ff5d5d';
    setTimeout(connect, 3000);
  };
}

setInterval(() => {
  const d = new Date();
  $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}, 1000);

connect();
</script>
</body>
</html>
